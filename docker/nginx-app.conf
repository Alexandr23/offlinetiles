# Shared by nginx.conf (HTTP) and nginx-https.conf (HTTPS). Included inside a server block.
# Avoid add_header here: it would replace the security headers set at server level.

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Static app with client-side routing.
location / {
  try_files $uri $uri/ /index.html;
}

location = /index.html {
  expires -1;
}

# Vite emits content-hashed file names under /assets/.
location /assets/ {
  expires 1y;
}

# API, tiles, fonts, downloads and the SSE stream are proxied to the server.
location /api/ {
  proxy_pass http://server:3000/api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;   # tiles.json builds absolute URLs from this
  proxy_set_header Connection "";
  proxy_buffering off;          # required for Server-Sent Events
  proxy_cache off;
  proxy_read_timeout 3600s;     # long-lived SSE connections and large downloads
  proxy_send_timeout 3600s;
  client_max_body_size 16m;     # style snapshots
}
