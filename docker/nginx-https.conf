# HTTPS config for offlinetiles.com. Activated by docker/web-entrypoint.sh when
# /etc/letsencrypt/live/offlinetiles.com/ contains a certificate.

# Port 80: ACME challenges (needed for every renewal) + redirect everything else.
server {
  listen 80;
  server_name offlinetiles.com www.offlinetiles.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://offlinetiles.com$request_uri;
  }
}

# www → apex
server {
  listen 443 ssl;
  http2 on;
  server_name www.offlinetiles.com;

  ssl_certificate     /etc/letsencrypt/live/offlinetiles.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/offlinetiles.com/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;

  return 301 https://offlinetiles.com$request_uri;
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name offlinetiles.com;

  ssl_certificate     /etc/letsencrypt/live/offlinetiles.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/offlinetiles.com/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;

  include /etc/nginx/snippets/app.conf;
}
