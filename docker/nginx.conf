# HTTP-only config. Used locally and on the server until a certificate exists
# (docker/web-entrypoint.sh switches to nginx-https.conf once it does).
server {
  listen 80;
  server_name _;

  # Let's Encrypt HTTP-01 challenge files written by the certbot container.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  include /etc/nginx/snippets/app.conf;
}
