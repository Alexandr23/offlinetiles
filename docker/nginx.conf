server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static app with client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API, tiles, fonts, downloads and the SSE stream are proxied to the server.
  location /api/ {
    proxy_pass http://server:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;          # required for Server-Sent Events
    proxy_cache off;
    proxy_read_timeout 3600s;     # long-lived SSE connections and large downloads
    client_max_body_size 16m;     # style snapshots
  }
}
