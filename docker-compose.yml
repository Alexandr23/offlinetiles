name: map-exporter

# Shared by server and worker. Values come from .env in this directory (compose interpolation).
x-app-env: &app-env
  DATABASE_URL: postgres://mapexporter:${POSTGRES_PASSWORD:-mapexporter}@postgres:5432/mapexporter
  DATA_DIR: /data
  GENERATOR_BINARY: /usr/local/bin/tile-generator
  RASTER_RENDERER_COMMAND: node /app/apps/renderer/src/index.js
  # Public origin written into exported style.json (e.g. https://offlinetiles.com)
  PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}
  ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mapexporter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mapexporter}
      POSTGRES_DB: mapexporter
    # Loopback only: reachable from the host (pnpm dev), never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapexporter -d mapexporter"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    command: ["node", "--import", "tsx", "apps/server/src/main.ts", "api"]
    environment:
      <<: *app-env
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    command: ["node", "--import", "tsx", "apps/server/src/main.ts", "worker"]
    environment:
      <<: *app-env
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  # nginx: static app + /api proxy. HTTP until a certificate exists, then HTTPS
  # (docker/web-entrypoint.sh). Reloads itself every 6h to pick up renewed certs.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - server
    profiles: ["full"]

  # Let's Encrypt renewal loop. `certbot renew` is a no-op until a certificate is
  # due, so checking twice a day is safe. One-off certbot commands must override
  # the entrypoint: `docker compose run --rm --entrypoint certbot certbot ...`.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          date -u '+[certbot] %Y-%m-%dT%H:%M:%SZ renewal check'
          certbot renew --webroot -w /var/www/certbot --no-random-sleep-on-renew
          sleep 12h & wait $${!}
        done
    profiles: ["full"]

volumes:
  pgdata:
  certbot-www:
  certbot-etc:
