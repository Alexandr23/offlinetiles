<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--
      Title, description, canonical, Open Graph / Twitter tags, JSON-LD and the no-JS fallback
      inside #root are injected at build time by the landing-static plugin (vite.config.ts)
      from src/modules/landing/landing.content.ts. Edit the copy there, not here.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        background: #070b12;
      }
      /* Fallback content is for no-JS visitors and crawlers; the app replaces it on mount. */
      .static-landing {
        display: none;
      }
    </style>
    <noscript>
      <style>
        .static-landing {
          display: block;
          max-width: 720px;
          margin: 0 auto;
          padding: 48px 24px;
          color: #f2f5f9;
          font: 15px/1.6 system-ui, sans-serif;
        }
        .static-landing a {
          color: #4fd1ff;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
