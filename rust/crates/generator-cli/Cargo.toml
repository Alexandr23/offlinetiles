[package]
name = "generator-cli"
description = "tile-generator: command line entry point used by the Node worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tile-generator"
path = "src/main.rs"

[dependencies]
generator-core = { workspace = true }
vector-generator = { workspace = true }
raster-generator = { workspace = true }
pmtiles-source = { workspace = true, features = ["fixture"] }
tile-selector = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
